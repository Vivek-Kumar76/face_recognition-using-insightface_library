services:
  - type: web
    name: face-recognition-api
    runtime: python
    buildCommand: pip install -r requirements.txt && INSIGHTFACE_MODEL=buffalo_s python download_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: INSIGHTFACE_MODEL
        value: buffalo_s
      - key: INSIGHTFACE_DET_SIZE
        value: "320"